# azure-pipelines.yml (Frontend - React/Vite)
# Sprint 1: Full Build & Validation Pipeline

trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  nodeVersion: '20.x'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '$(nodeVersion)'
  displayName: 'Install Node.js'

- script: |
    npm ci
  displayName: 'Install NPM Dependencies (npm ci for clean install)'

- script: |
    npm run lint
  displayName: 'Run ESLint Code Quality Check'
  continueOnError: false

- script: |
    # Assuming Vite uses Vitest or Jest. Update the package.json test script to output JUnit if needed.
    npm run test --if-present
  displayName: 'Run Frontend Unit Tests'
  continueOnError: false

- script: |
    npm run build
  displayName: 'Build Vite Production Bundle'
  continueOnError: false

- task: PublishPipelineArtifact@1
  inputs:
    targetPath: 'dist' # Vite outputs to 'dist' by default
    artifact: 'frontend-build'
    publishLocation: 'pipeline'
  displayName: 'Publish Build Artifact (dist folder)'

