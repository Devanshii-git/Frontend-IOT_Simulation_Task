# azure-pipelines.yml (Frontend)
# Sprint 3: Full Build & Validation Pipeline

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  node_version: '20.x' # standard modern Node.js version

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '$(node_version)'
  displayName: 'Install Node.js'

- script: |
    npm install
  displayName: 'Install Dependencies'

- script: |
    npm audit --audit-level=high || true
  displayName: 'Run Dependency Scan (npm audit)'
  continueOnError: true

- script: |
    npm run lint
  displayName: 'Run Linting (ESLint)'
  continueOnError: false

- script: |
    npm run build
  displayName: 'Run Build (TypeScript compiler & Vite)'
  continueOnError: false

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(System.DefaultWorkingDirectory)/dist'
    ArtifactName: 'drop-frontend'
    publishLocation: 'Container'
  displayName: 'Publish Frontend Artifact'
